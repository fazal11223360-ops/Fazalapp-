<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FazalAI</title><script src="https://js.puter.com/v2/"></script><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>body{margin:0;background:#212121;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}#h{padding:15px;text-align:center;border-bottom:1px solid #333;font-weight:700}#c{flex:1;overflow-y:auto;padding:20px;max-width:800px;width:100%;margin:0 auto}.m{margin:12px 0;padding:12px 16px;border-radius:18px;line-height:1.6}.u{background:#2f2f2f;margin-left:auto;max-width:80%}.a{background:#444654}#b{display:flex;background:#2f2f2f;border-radius:24px;padding:8px 14px;margin:0 auto 20px;max-width:800px;width:90%}#q{flex:1;background:0 0;border:0;color:#fff;outline:0;font-size:16px}#s{background:#fff;border:0;width:32px;height:32px;border-radius:50%;cursor:pointer}</style></head><body><div id="h">FazalAI - ChatGPT Clone</div><div id="c"><div class="m a">Salam Fazal! Main FazalAI hun, ChatGPT ki tarah har sawal ka jawab dunga!</div></div><div id="b"><input id="q" placeholder="Message FazalAI..."><button id="s" onclick="ask()">↑</button></div><script>async function ask(){let i=document.getElementById('q'),t=i.value.trim();if(!t)return;let c=document.getElementById('c');c.innerHTML+=`<div class="m u">${t}</div>`;i.value='';let id='x'+Date.now();c.innerHTML+=`<div class="m a" id="${id}">...</div>`;c.scrollTop=c.scrollHeight;try{let r=await puter.ai.chat(t);document.getElementById(id).innerHTML=marked.parse(r.toString())}catch(e){document.getElementById(id).innerHTML='Error: '+e.message}c.scrollTop=c.scrollHeight}q.addEventListener('keypress',e=>{if(e.key==='Enter')ask()})</script></body></html>
