<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FazalAI</title><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#212121;color:#ececec;font-family:system-ui;height:100dvh;display:flex;flex-direction:column}header{height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #333;font-weight:700;background:#171717}#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:800px;width:100%;margin:0 auto}.msg{padding:12px 16px;border-radius:16px;max-width:85%}.user{background:#2f2f2f;align-self:flex-end}.bot{background:#444654;align-self:flex-start;white-space:pre-wrap}.wrap{padding:12px;background:#212121}.box{max-width:800px;margin:0 auto;background:#2f2f2f;border-radius:28px;display:flex;padding:10px 16px;gap:10px}input{flex:1;background:transparent;border:0;color:#fff;font-size:16px;outline:none}button{background:#fff;color:#000;border:0;width:34px;height:34px;border-radius:50%}</style></head><body><header>FazalAI</header><div id="chat"><div class="msg bot">Salam Fazal! Ab Puter nahi ayega, direct jawab dunga!</div></div><div class="wrap"><div class="box"><input id="q" placeholder="Message..."><button onclick="ask()">↑</button></div></div><script>const c=document.getElementById('chat'),i=document.getElementById('q');async function ask(){let t=i.value.trim();if(!t)return;c.innerHTML+=`<div class="msg user">${t}</div>`;i.value='';let id='b'+Date.now();c.innerHTML+=`<div class="msg bot" id="${id}">Soch raha hun...</div>`;c.scrollTop=c.scrollHeight;try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(t));let x=await r.text();document.getElementById(id).innerText=x}catch(e){document.getElementById(id).innerText='Error: '+e.message}c.scrollTop=c.scrollHeight}i.addEventListener('keydown',e=>{if(e.key==='Enter')ask()})</script></body></html>
